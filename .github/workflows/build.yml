name: Build Java Project
env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  APPLICATION_NAME: ${{ vars.APPLICATION_NAME }}
  ENVIRONMENT_NAME: ${{ vars.ENVIRONMENT_NAME }}
  S3_BUCKET: ${{ vars.S3_BUCKET }}
  
on:
  push:
    branches:
      - main

  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '17'
          cache: maven
          
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::878145708291:role/GithubActions
          aws-region: us-east-1     

      - name: Build with Maven
        run: mvn clean package

        - name: Upload JAR
                run: |
                  aws s3 cp target/*.jar \
                    s3://${{ env.S3_BUCKET }}/app-${{ github.sha }}.jar

        - name: Create application version
          run: |
            aws elasticbeanstalk create-application-version \
              --application-name "${{ env.APPLICATION_NAME }}" \
              --version-label "${{ github.sha }}" \
              --source-bundle \
                S3Bucket=${{ env.S3_BUCKET }},S3Key=app-${{ github.sha }}.jar

        - name: Deploy
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name "${{ env.ENVIRONMENT_NAME }}" \
            --version-label "${{ github.sha }}"
            
            
    